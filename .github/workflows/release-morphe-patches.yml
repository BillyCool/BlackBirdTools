name: Release Morphe patches

# Push a version tag (for example v1.0.1) to build the .mpp, publish it as a GitHub release
# and point morphe-patches/patches-bundle.json on main at it, which is what Morphe Manager reads.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

concurrency:
  group: release-morphe-patches
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Read version from tag
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build .mpp
        working-directory: morphe-patches
        env:
          # Morphe's Gradle plugin is served from GitHub Packages.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sed -i "s/^version = .*/version = $VERSION/" gradle.properties
          bash ./gradlew :patches:buildAndroid --no-daemon
          test -f "patches/build/libs/patches-$VERSION.mpp"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" "morphe-patches/patches/build/libs/patches-$VERSION.mpp" \
            --title "$TAG" --generate-notes --verify-tag

      - name: Update patches-bundle.json on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --depth 1 origin main
          git checkout -B main origin/main

          release=$(gh release view "$TAG" --json body,createdAt)
          jq -n \
            --arg version "$VERSION" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/patches-$VERSION.mpp" \
            --arg created "$(jq -r '.createdAt | sub("Z$"; "")' <<< "$release")" \
            --arg description "$(jq -r '.body' <<< "$release")" \
            '{created_at: $created, description: $description, download_url: $url, signature_download_url: "", version: $version}' \
            > morphe-patches/patches-bundle.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morphe-patches/patches-bundle.json
          git commit -m "chore: Morphe patches $TAG"
          git push origin main
